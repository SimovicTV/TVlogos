name: Build OTT icons pack (DE, CH, RS, UK)

on:
  workflow_dispatch:
  schedule:
    # Zimsko računanje vremena: 01:00 u Srbiji (00:00 UTC)
    - cron: "0 0 1 1-3,11,12 *"
    # Letnje računanje vremena: okida prethodne UTC večeri;
    # schedule_guard propušta samo 01:00 prvog dana u Europe/Belgrade.
    - cron: "0 23 30,31 3-9 *"
  push:
    paths:
      - ".github/workflows/build-germany-logos.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v5

      - name: Check monthly schedule in Serbia timezone
        id: schedule_guard
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs and repository updates should still build immediately.
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "run_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          local_time="$(TZ=Europe/Belgrade date '+%d %H:%M')"
          local_day="${local_time%% *}"
          if [[ "${local_day}" == "01" ]]; then
            echo "run_build=true" >> "${GITHUB_OUTPUT}"
            echo "Confirmed scheduled run on the first day in Europe/Belgrade; current local time: ${local_time}."
          else
            echo "run_build=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping this UTC cron occurrence; local time is ${local_time}."
          fi

      - name: Download PNG logos from Fourqui
        if: steps.schedule_guard.outputs.run_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/source
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.request

          REPOSITORY = "Fourqui/tv"
          SOURCE_COMMIT = "8ce8a93bf7eec29b4c563137de3d005fba56ccd7"
          COUNTRIES = ("germany", "switzerland", "serbia", "united-kingdom")
          ROOT = pathlib.Path("work/source")
          ROOT.mkdir(parents=True, exist_ok=True)

          def get_bytes(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SimovicTV-OTT-Icons-Builder",
                      "Accept": "application/vnd.github+json",
                  },
              )
              last_error = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return response.read()
                  except (urllib.error.URLError, TimeoutError) as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"Download failed: {url}: {last_error}")

          total = 0
          for country in COUNTRIES:
              api_url = (
                  f"https://api.github.com/repos/{REPOSITORY}/contents/"
                  f"countries/{country}?ref={SOURCE_COMMIT}"
              )
              entries = json.loads(get_bytes(api_url).decode("utf-8"))
              if not isinstance(entries, list):
                  raise RuntimeError(f"GitHub did not return a file list for {country}")

              target_dir = ROOT / country
              target_dir.mkdir(parents=True, exist_ok=True)
              country_count = 0

              for item in entries:
                  if item.get("type") != "file":
                      continue

                  name = item.get("name", "")
                  if not name.lower().endswith(".png"):
                      continue

                  download_url = item.get("download_url")
                  if not download_url:
                      raise RuntimeError(f"Missing download URL for {country}/{name}")

                  data = get_bytes(download_url)
                  if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise RuntimeError(f"File has .png extension but is not a PNG: {country}/{name}")

                  (target_dir / pathlib.Path(name).name).write_bytes(data)
                  country_count += 1

              if country_count == 0:
                  raise RuntimeError(f"No PNG files were found in {country}")

              total += country_count
              print(f"{country}: downloaded {country_count} PNG files")

          print(f"Total PNG files downloaded: {total}")
          if total == 0:
              raise SystemExit("No PNG files downloaded.")
          PY

      - name: Build one flat OTT-Icons.zip and resolve duplicate names
        if: steps.schedule_guard.outputs.run_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python - <<'PY'
          import pathlib
          import zipfile

          COUNTRIES = ("germany", "switzerland", "serbia", "united-kingdom")
          SOURCE = pathlib.Path("work/source")
          ARCHIVE = pathlib.Path("dist/OTT-Icons.zip")

          used_names = set()
          duplicate_count = 0
          file_count = 0

          with zipfile.ZipFile(
              ARCHIVE,
              mode="w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for country in COUNTRIES:
                  country_dir = SOURCE / country
                  for path in sorted(country_dir.glob("*.png"), key=lambda p: p.name.casefold()):
                      stem = path.stem
                      suffix = path.suffix
                      archive_name = path.name
                      copy_number = 0

                      while archive_name.casefold() in used_names:
                          copy_number += 1
                          archive_name = f"{stem}-copy{copy_number}{suffix}"

                      if copy_number:
                          duplicate_count += 1
                          print(f"Duplicate renamed: {path.name} -> {archive_name}")

                      used_names.add(archive_name.casefold())

                      # Fixed ZIP timestamp keeps the archive reproducible when logos have not changed.
                      info = zipfile.ZipInfo(archive_name, date_time=(2020, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED)
                      file_count += 1

          if file_count == 0:
              raise SystemExit("ZIP would be empty.")

          print(f"Created {ARCHIVE}")
          print(f"PNG files in ZIP: {file_count}")
          print(f"Duplicate filenames renamed: {duplicate_count}")

          # Verify archive integrity before publishing.
          with zipfile.ZipFile(ARCHIVE) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise SystemExit(f"ZIP integrity check failed: {bad_file}")
          PY

      - name: Commit ZIP into OTTNavigator folder
        if: steps.schedule_guard.outputs.run_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p OTTNavigator
          cp dist/OTT-Icons.zip OTTNavigator/OTT-Icons.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add OTTNavigator/OTT-Icons.zip
          if git diff --cached --quiet; then
            echo "OTT-Icons.zip is unchanged; no repository commit needed."
          else
            git commit -m "Update OTT Navigator icons (DE, CH, RS, UK)"
            git push
          fi

      - name: Publish OTT-Icons.zip in GitHub Releases
        if: steps.schedule_guard.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: logo-pack
          name: OTT Navigator Icons - DE, CH, RS, UK
          body: |
            Combined OTT Navigator icon pack.
            Sources: Fourqui/tv countries/germany, switzerland, serbia and united-kingdom.
            Source commit: 8ce8a93bf7eec29b4c563137de3d005fba56ccd7
          files: dist/OTT-Icons.zip
          overwrite_files: true
          make_latest: true
